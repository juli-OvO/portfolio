<!doctype html>
<!-- @dsCard group="UI Kit — Portfolio" name="Case — Drawings" subtitle="Label-style carousel: centred sheet in a crop-marked frame, ghosted neighbours bleeding off both edges, prev/next counter" viewport="1440x900" -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Drawings — Julianne Jin</title>
<link rel="stylesheet" href="../../colors_and_type.css">
<script src="page-swipe.js"></script>
<link rel="stylesheet" href="case-page.css">
<script src="image-slot.js"></script>
<style>
  body{background:#fff}
  .stagewrap{position:relative;height:100vh;display:flex;flex-direction:column;overflow:hidden}

  /* crop marks on the page frame */
  .crop{position:fixed;width:26px;height:26px;z-index:40;pointer-events:none;border:0 solid var(--ink)}
  .crop.tl{top:78px;left:26px;border-left-width:1.5px;border-top-width:1.5px}
  .crop.tr{top:78px;right:26px;border-right-width:1.5px;border-top-width:1.5px}
  .crop.bl{bottom:26px;left:26px;border-left-width:1.5px;border-bottom-width:1.5px}
  .crop.br{bottom:26px;right:26px;border-right-width:1.5px;border-bottom-width:1.5px}

  /* ---- carousel ---- */
  .rail{position:relative;flex:1;min-height:0;display:flex;align-items:center;justify-content:center;
    padding:clamp(96px,12vh,132px) 0 clamp(24px,3vh,40px)}
  .track{position:relative;width:100%;height:100%;max-height:clamp(240px,58vh,600px)}
  /* the item is a 3-row grid — tab band, square frame, meta band — so the browser
     reserves space for the bands and derives the sheet width from the row that is left */
  .item{position:absolute;top:50%;left:50%;height:100%;width:var(--sheet,300px);
    display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(0,1fr) auto;
    transform:translate3d(-50%,-50%,0);transition:transform .68s cubic-bezier(.16,1,.3,1),opacity .5s,filter .5s;
    opacity:.16;filter:grayscale(1);cursor:pointer}
  .item.active{opacity:1;filter:none;cursor:default;z-index:5}
  .item .frame{position:relative;border:1px solid var(--ink-hair);background:#fff;
    width:fit-content;max-width:100%;height:auto;align-self:center;justify-self:center;
    display:flex;align-items:center;justify-content:center;overflow:visible}
  .item.active .frame{border-color:transparent}
  .item .frame img{display:block;width:100%;height:auto;
    max-height:var(--artmax,52vh);object-fit:contain}
  .item .frame image-slot{display:block;width:var(--sheet,300px);max-width:100%;aspect-ratio:4/3}
  /* the active item gets crop-mark corners instead of a full border */
  .item .cm{position:absolute;width:16px;height:16px;border:0 solid var(--ink);opacity:0;transition:opacity .4s}
  .item.active .cm{opacity:1}
  .cm.a{top:-1px;left:-1px;border-left-width:1.5px;border-top-width:1.5px}
  .cm.b{top:-1px;right:-1px;border-right-width:1.5px;border-top-width:1.5px}
  .cm.c{bottom:-1px;left:-1px;border-left-width:1.5px;border-bottom-width:1.5px}
  .cm.d{bottom:-1px;right:-1px;border-right-width:1.5px;border-bottom-width:1.5px}

  /* row 1 — tab label + transport, laid out as a real grid row */
  .band{grid-row:1;min-width:0;display:flex;align-items:flex-end;justify-content:space-between;gap:16px}
  .tab{min-width:0;display:flex;align-items:center;gap:10px;background:var(--ink);color:#fff;
    padding:10px 16px;font-size:12.5px;letter-spacing:.18em;text-transform:uppercase;white-space:nowrap;
    overflow:hidden;text-overflow:ellipsis;opacity:0;transition:opacity .4s}
  .item.active .tab{opacity:1}
  .tab .sq{width:8px;height:8px;background:#fff;display:inline-block}
  .tools{flex:none;display:flex;gap:18px;padding:0 2px 10px;opacity:0;transition:opacity .4s}
  .item.active .tools{opacity:1}
  .tools button{background:none;border:0;padding:0;cursor:pointer;color:var(--ink);font-size:15px;line-height:1;
    font-family:var(--font-mono);transition:color .2s}
  .tools button:hover{color:var(--acc)}

  /* row 3 — meta under the frame */
  .meta{grid-row:3;min-width:0;display:flex;justify-content:space-between;gap:20px;
    padding-top:14px;font-size:13px;letter-spacing:.13em;text-transform:uppercase;opacity:0;transition:opacity .4s}
  .item.active .meta{opacity:1}
  .meta .l{min-width:0;display:flex;flex-direction:column;gap:5px;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .meta .l .no{color:var(--bp-soft)}
  .meta .r{display:flex;flex-direction:column;gap:5px;align-items:flex-end}
  .meta .r button{background:none;border:0;padding:0;cursor:pointer;font-family:var(--font-mono);font-size:13px;
    letter-spacing:.13em;text-transform:uppercase;color:var(--ink);transition:color .2s}
  .meta .r button:hover{color:var(--acc)}

  /* ---- bottom bar ---- */
  .bar{display:grid;grid-template-columns:1fr auto 1fr;align-items:end;gap:20px;flex:none;
    padding:0 clamp(40px,6vw,86px) clamp(30px,4.5vh,58px)}
  .bar .blurb{max-width:44ch}
  .bar .blurb .k{display:flex;align-items:center;gap:10px;font-size:12.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--ink)}
  .bar .blurb .k .sq{width:8px;height:8px;background:var(--ink)}
  .bar .blurb p{margin:16px 0 0;font-size:12.5px;line-height:1.8;letter-spacing:.06em;text-transform:uppercase;
    color:var(--ink-soft);text-align:justify}
  .pager{display:flex;align-items:center;gap:22px;font-size:13.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink)}
  .pager button{background:none;border:0;padding:6px 2px;cursor:pointer;font-family:var(--font-mono);font-size:13.5px;
    letter-spacing:.14em;text-transform:uppercase;color:var(--ink);transition:color .2s}
  .pager button:hover{color:var(--acc)}
  .pager .cnt{color:var(--bp-soft);min-width:66px;text-align:center}
  .filters{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
  .fchip{font-family:var(--font-mono);font-size:11.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink);
    background:none;border:0;padding:5px 2px;cursor:pointer;display:flex;align-items:center;gap:8px;transition:color .2s}
  .fchip .sq{width:8px;height:8px;background:var(--ink-hair);transition:background .2s}
  .fchip:hover{color:var(--bp)}
  .fchip[aria-pressed="true"] .sq{background:var(--acc)}
  @media(max-width:900px){
    .bar{grid-template-columns:1fr;gap:26px}
    .filters{justify-content:flex-start}
    .bar .blurb{order:3}
  }

  /* ---- info panel ---- */
  .info{position:fixed;inset:0;z-index:150;background:hsla(28,24%,10%,.93);backdrop-filter:blur(7px);
    display:flex;align-items:center;justify-content:center;padding:clamp(24px,6vh,80px);opacity:0;pointer-events:none;transition:opacity .34s}
  .info.on{opacity:1;pointer-events:auto}
  .info .card{max-width:640px;color:#fff}
  .info h3{font-size:clamp(28px,4vw,52px);font-weight:700;letter-spacing:-.02em;margin:0 0 18px;text-transform:uppercase}
  .info p{font-size:15px;line-height:1.8;color:hsla(0,0%,100%,.72);margin:0 0 14px}
  .info .rows{margin-top:26px;border-top:1px solid hsla(0,0%,100%,.2)}
  .info .rows div{display:grid;grid-template-columns:110px 1fr;gap:16px;padding:12px 0;border-bottom:1px solid hsla(0,0%,100%,.14);
    font-size:12.5px;letter-spacing:.13em;text-transform:uppercase;color:hsla(0,0%,100%,.75)}
  .info .rows b{color:hsla(0,0%,100%,.45);font-weight:400}
  .infox{position:absolute;top:26px;right:26px;background:none;border:1.5px solid hsla(0,0%,100%,.4);color:#fff;
    font-family:var(--font-mono);font-size:12.5px;letter-spacing:.14em;text-transform:uppercase;padding:9px 15px;cursor:pointer}
  .infox:hover{background:hsla(0,0%,100%,.12)}
</style>
</head>
<body>
<div class="prog"></div>
<div class="crop tl"></div><div class="crop tr"></div><div class="crop bl"></div><div class="crop br"></div>

<div class="chrome">
  <a class="cbtn" href="Index - Wall.html">← Index</a>
  <div class="mid">Drawings · Catalogue · 2021–25</div>
  <div class="cnav">
    <a class="cbtn" href="Case - Illustration.html">Illustration →</a>
    <button class="cbtn acc" id="shuffle" type="button">Shuffle</button>
  </div>
</div>

<div class="stagewrap">
  <div class="rail"><div class="track" id="track"></div></div>

  <div class="bar">
    <div class="blurb">
      <div class="k"><span class="sq"></span>Drawings</div>
      <p>Observational studies in graphite, ink, and digital media. Numbered and dated as a working archive since 2021.</p>
    </div>
    <div class="pager">
      <button id="prev" type="button">&lt; Prev</button>
      <span class="cnt" id="cnt">1 / 8</span>
      <button id="next" type="button">Next &gt;</button>
    </div>
    <div class="filters" id="filters">
      <button class="fchip" type="button" data-f="all" aria-pressed="true"><span class="sq"></span>All</button>
      <button class="fchip" type="button" data-f="figure" aria-pressed="false"><span class="sq"></span>Figure</button>
      <button class="fchip" type="button" data-f="study" aria-pressed="false"><span class="sq"></span>Study</button>
      <button class="fchip" type="button" data-f="digital" aria-pressed="false"><span class="sq"></span>Digital</button>
      <button class="fchip" type="button" data-f="sketchbook" aria-pressed="false"><span class="sq"></span>Sketchbook</button>
    </div>
  </div>
</div>

<div class="info" id="info">
  <button class="infox" id="infox" type="button">Close ✕</button>
  <div class="card">
    <h3 id="infoT"></h3>
    <p id="infoD"></p>
    <div class="rows">
      <div><b>Catalogue</b><span id="infoN"></span></div>
      <div><b>Medium</b><span id="infoM"></span></div>
      <div><b>Date</b><span id="infoY"></span></div>
      <div><b>Filed under</b><span id="infoF"></span></div>
    </div>
  </div>
</div>

<script src="drawings.js"></script>
</body>
</html>
