<!doctype html>
<!-- @dsCard group="Brand" name="Brand — Boids Background" subtitle="3 flocks · orange/coral/yellow · mouse repulse" viewport="700x160" --><html><head><meta charset="utf-8"><style>html,body{margin:0;background:#fff}canvas{display:block;width:100%;height:150px}</style></head><body><canvas id="c"></canvas><script>
const c=document.getElementById('c');const x=c.getContext('2d');
function r(){c.width=c.clientWidth*2;c.height=300;x.setTransform(2,0,0,2,0,0);}r();addEventListener('resize',r);
const B=[];for(let i=0;i<22;i++){B.push({x:Math.random()*c.clientWidth,y:Math.random()*150,h:Math.random()*2*Math.PI,s:0.5+Math.random()*0.6,r:6+Math.random()*4,hue:30+Math.random()*30-15});}
function step(){x.clearRect(0,0,c.clientWidth,150);for(const b of B){b.h+=(Math.random()-0.5)*0.05;b.x+=Math.cos(b.h)*b.s;b.y+=Math.sin(b.h)*b.s;if(b.x<0)b.x+=c.clientWidth;if(b.x>c.clientWidth)b.x-=c.clientWidth;if(b.y<0)b.y+=150;if(b.y>150)b.y-=150;x.strokeStyle=`hsla(${b.hue} 85% 55% / 0.8)`;x.lineWidth=1;x.beginPath();x.arc(b.x,b.y,b.r,0,Math.PI*2);x.stroke();}requestAnimationFrame(step);}step();
</script><div style="position:absolute;bottom:8px;left:12px;font-family:'Inconsolata',monospace;font-size:10px;opacity:0.55;letter-spacing:0.08em">BOIDS BACKGROUND · 3 FLOCKS · ORANGE / CORAL / YELLOW HUES · MOUSE REPULSE</div></body></html>
